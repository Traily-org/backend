version: "3"

tasks:
  compile:
    desc: compile traily's backend
    cmds:
      - go build -o bin/traily ./cmd/main.go

  run:
    desc: run traily's api
    deps:
      - compile
    cmds:
      - ./bin/traily

  test:
    desc: run unit tests
    cmds:
      - go test ./...

  test:integration:
    desc: run integration tests (requires Docker running)
    env:
      CGO_ENABLED: 0
    cmds:
      - go test -tags=integration ./...

  migrate:
    desc: run pending DB migrations manually
    cmds:
      - go run ./cmd/migrate

  docker:migrate:
    desc: run pending DB migrations manually inside the dev container
    cmds:
      - docker compose exec api go run ./cmd/migrate

  seed:
    desc: fill the dev database with sample accounts, content and reports (idempotent)
    cmds:
      - go run ./cmd/seed

  docker:seed:
    desc: fill the dev database with sample data inside the dev container
    cmds:
      - docker compose exec api go run ./cmd/seed

  docker:dev:
    desc: run traily's api in dev mode, removing containers on stop
    cmds:
      - defer: docker compose down
      - docker compose up -V --build

  docker:prod:
    desc: run traily's api in prod mode, removing containers on stop
    cmds:
      - defer: docker compose -f docker-compose.prod.yml down
      - docker compose -f docker-compose.prod.yml up --build
