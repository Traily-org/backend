name: CI Backend

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "feat/**", "feature/**", "fix/**"]

env:
  GO_VERSION: "1.26.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protect-main:
    name: Protection main (PR uniquement depuis develop)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la branche source
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::Les PR vers main ne sont autorisées que depuis develop (source actuelle : ${{ github.head_ref }})"
            exit 1
          fi

  format:
    name: Formatage (gofmt/goimports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          diff="$(gofmt -l .)"
          if [ -n "$diff" ]; then
            echo "Fichiers non formatés (gofmt) :"
            echo "$diff"
            exit 1
          fi
      - name: goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          diff="$(goimports -l .)"
          if [ -n "$diff" ]; then
            echo "Fichiers non formatés (goimports) :"
            echo "$diff"
            exit 1
          fi

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        run: go test ./...
      - name: Couverture (informatif, non bloquant)
        run: |
          go test -coverprofile=coverage.out ./... || true
          if [ -s coverage.out ]; then
            total="$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | tr -d '%')"
            echo "Couverture totale : ${total}%"
            if awk "BEGIN {exit !($total < 60)}"; then
              echo "::warning::Couverture de tests ${total}% inférieure à la cible de 60%"
            fi
          fi

  integration-test:
    name: Tests d'intégration
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'develop') ||
      (github.event_name == 'push' && (
        github.ref_name == 'develop' ||
        startsWith(github.ref_name, 'feat/') ||
        startsWith(github.ref_name, 'feature/') ||
        startsWith(github.ref_name, 'fix/')
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test (integration)
        run: go test -tags=integration ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build -o bin/traily ./cmd/main.go

  docker-build:
    name: Build image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
